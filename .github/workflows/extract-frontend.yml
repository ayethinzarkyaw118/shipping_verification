name: Extract uploaded frontend source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  extract:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract frontend source
        shell: bash
        run: |
          set -euo pipefail

          ZIP="frontend/frontend-source.zip"
          if [ ! -f "$ZIP" ]; then
            echo "No frontend source ZIP found; nothing to do."
            exit 0
          fi

          rm -rf frontend/.extract_tmp
          mkdir -p frontend/.extract_tmp
          unzip -q -o "$ZIP" -d frontend/.extract_tmp

          SRC="frontend/.extract_tmp"
          ENTRY_COUNT="$(find "$SRC" -mindepth 1 -maxdepth 1 | wc -l | tr -d ' ')"
          if [ "$ENTRY_COUNT" = "1" ]; then
            ONLY="$(find "$SRC" -mindepth 1 -maxdepth 1 | head -n 1)"
            if [ -d "$ONLY" ]; then
              SRC="$ONLY"
            fi
          fi

          find frontend -mindepth 1 -maxdepth 1 \
            ! -name '.extract_tmp' \
            ! -name 'frontend-source.zip' \
            -exec rm -rf {} +

          cp -a "$SRC"/. frontend/
          rm -rf frontend/.extract_tmp
          rm -f frontend/frontend-source.zip

      - name: Commit extracted frontend
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No frontend changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend
          git commit -m "Extract existing frontend source"
          git push
